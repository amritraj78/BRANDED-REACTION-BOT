name: 💡 Feature Request
description: Suggest an idea or new feature for VIP Reaction & AI Chatbot
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have a feature idea? Let us know!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem or limitation.
      placeholder: I'm always frustrated when...
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Describe the feature you would like
      description: A clear and concise description of what you want to happen.
      placeholder: It would be awesome if the bot could...
    validations:
      required: true
